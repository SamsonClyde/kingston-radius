<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <circle cx="16" cy="16" r="16" fill="#C0392B"/>
  <!-- outer ring -->
  <circle cx="16" cy="16" r="13" fill="none" stroke="#fff" stroke-width="3"/>
  <!-- inner subtle ring -->
  <circle cx="16" cy="16" r="5.5" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- radius line at 45deg upper-right -->
  <line x1="16" y1="16" x2="25.2" y2="6.8" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <!-- dot at circumference -->
  <circle cx="25.2" cy="6.8" r="2.5" fill="#fff"/>
  <!-- center dot -->
  <circle cx="16" cy="16" r="3" fill="#fff"/>
</svg>
