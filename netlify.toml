[functions]
  node_bundler = "esbuild"

[build]
  ignore = "git diff --name-only HEAD^ HEAD | grep -qvE '^(manual-events\\.json|review-status\\.json)$' && exit 1 || exit 0"

# The old /blog address (and /explore) now open the poster Feed on the main Music page.
[[redirects]]
  from = "/blog"
  to = "/?tab=explore"
  status = 301

[[redirects]]
  from = "/blog/"
  to = "/?tab=explore"
  status = 301

[[redirects]]
  from = "/explore"
  to = "/?tab=explore"
  status = 301

# force = true so this still applies if an old blog.html is left sitting on the site
[[redirects]]
  from = "/blog.html"
  to = "/?tab=explore"
  status = 301
  force = true

# Private poster archive: kingstonradius.com/graveyard (not linked anywhere, not in the sitemap)
[[redirects]]
  from = "/graveyard"
  to = "/graveyard.html"
  status = 200
