[functions]
  node_bundler = "esbuild"

[build]
  ignore = "git diff --name-only HEAD^ HEAD | grep -qvE '^(manual-events\\.json|review-status\\.json)$' && exit 1 || exit 0"

# /explore still opens the poster Feed on the main Music page.
[[redirects]]
  from = "/explore"
  to = "/?tab=explore"
  status = 301

# The joke 90s page lives at kingstonradius.com/blog (blog.html is served as-is, not redirected).
[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/blog/"
  to = "/blog.html"
  status = 200

# Private poster archive: kingstonradius.com/graveyard (not linked anywhere, not in the sitemap)
[[redirects]]
  from = "/graveyard"
  to = "/graveyard.html"
  status = 200

# Secret page: kingstonradius.com/fun (the real site plus the blog's chaos). Not linked anywhere, not in the sitemap, marked noindex.
[[redirects]]
  from = "/fun"
  to = "/fun.html"
  status = 200

[[redirects]]
  from = "/fun/"
  to = "/fun.html"
  status = 200
