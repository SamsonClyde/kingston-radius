<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Graveyard</title>
<style>
  html, body { margin: 0; background: #0d0d0c; }
  #wall { display: flex; gap: 10px; padding: 10px; align-items: flex-start; }
  .col { flex: 1 1 0; min-width: 0; }
  .col a { display: block; margin: 0 0 10px; }
  #wall img { display: block; width: 100%; height: auto; border-radius: 4px; background: #1b1a18; }
</style>
</head>
<body>
<div id="wall"></div>
<script>
// Every past show that has a flyer, one page, newest first (the show that expired most recently is at the top left, then it reads across and down).
(async () => {
  const key = e => `${e.venue}||${e.date}||${e.time || ''}`;
  const rejected = s => s === 'rejected' || s === 'purged' || (s && typeof s === 'object' && (s.status === 'rejected' || s.status === 'purged'));
  const approved = s => s === 'approved' || (s && typeof s === 'object' && s.status === 'approved');
  let data;
  try { data = await (await fetch('/.netlify/functions/events-load')).json(); } catch (err) { return; }
  const status = data.reviewStatus || {};
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const pastDay = d => { const t = new Date(d + 'T00:00:00'); return !isNaN(t) && t < today; };
  const all = [
    ...(data.manualEvents  || []).map(e => ({ ...e, _manual: true })),
    ...(data.scrapedEvents || []),
    ...(data.emailEvents   || [])
  ];
  const mins = t => { const m = /(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i.exec(t || ''); if (!m) return 0; let h = +m[1] % 24; const ap = (m[3] || '').toLowerCase(); if (ap === 'pm' && h < 12) h += 12; if (ap === 'am' && h === 12) h = 0; return h * 60 + (+m[2] || 0); };
  const cand = [];
  for (const e of all) {
    if (!e.posterUrl || !pastDay(e.date)) continue;
    const s = status[key(e)];
    if (rejected(s)) continue;
    if (!e._manual && !approved(s)) continue;
    cand.push(e);
  }
  cand.sort((x, y) => (x.date < y.date ? 1 : x.date > y.date ? -1 : mins(y.time) - mins(x.time)));   // most recently expired first
  const seen = new Set(), urls = [];
  for (const e of cand) { if (seen.has(e.posterUrl)) continue; seen.add(e.posterUrl); urls.push(e.posterUrl); }
  const wall = document.getElementById('wall');
  const links = urls.map(u => {
    const a = document.createElement('a'); a.href = u; a.target = '_blank'; a.rel = 'noopener';
    const img = document.createElement('img'); img.src = u; img.loading = 'lazy'; img.decoding = 'async'; img.alt = '';
    img.onerror = () => a.remove();                     // a flyer that no longer exists just disappears
    a.appendChild(img); return a;
  });
  let ncol = 0;
  const layout = () => {
    const n = Math.max(2, Math.floor((window.innerWidth - 10) / 230));
    if (n === ncol) return; ncol = n; wall.textContent = '';
    const cols = Array.from({ length: n }, () => { const c = document.createElement('div'); c.className = 'col'; wall.appendChild(c); return c; });
    links.forEach((a, i) => cols[i % n].appendChild(a));   // round-robin so the order reads left to right, then down
  };
  layout();
  let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(layout, 150); });
})();
</script>
</body>
</html>
