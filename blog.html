<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Upcoming Shows — Kingston Radius</title>
<meta name="description" content="Upcoming Hudson Valley shows, with their posters.">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #C0392B;
    --bg: #F7F5F0;
    --card: #FFFFFF;
    --text: #1A1A18;
    --muted: #888880;
    --border: #E8E6E0;
    --tag-bg: #F0EEE8;
    --header-bg: #1A1A18;
    color-scheme: light;
  }
  [data-theme="dark"] {
    --red: #E2604A;
    --bg: #171613;
    --card: #211F1B;
    --text: #EDEAE2;
    --muted: #9B968C;
    --border: #37342D;
    --tag-bg: #29271F;
    --header-bg: #100F0D;
    color-scheme: dark;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }

  header {
    background: var(--header-bg); color: #fff; padding: 0 24px;
    display: flex; align-items: center; justify-content: space-between;
    height: 56px; position: sticky; top: 0; z-index: 100;
  }
  .logo { font-family: 'DM Serif Display', serif; font-size: 1.3rem; letter-spacing: 0.01em; color: #fff; text-decoration: none; }
  .logo span { color: var(--red); }
  #theme-toggle-btn {
    background: none; border: 1px solid rgba(255,255,255,0.25); border-radius: 20px;
    width: 30px; height: 30px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; color: #fff;
  }

  .pb-wrap { max-width: 640px; margin: 0 auto; padding: 28px 16px 60px; }
  .pb-head h1 { font-family: 'DM Serif Display', serif; font-size: 2.1rem; font-weight: 400; line-height: 1.1; }
  .pb-head p { font-family: 'Lora', serif; font-style: italic; color: var(--muted); font-size: 0.95rem; margin-top: 6px; }
  .pb-wrap.wall { max-width: 1000px; }
  .pb-filters { display: flex; flex-direction: column; gap: 10px; margin: 18px 0 6px; padding-bottom: 16px; border-bottom: 1px solid var(--border); }
  .pb-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .pb-search { width: 100%; border: 1.5px solid var(--border); background: transparent; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.9rem; padding: 9px 16px; border-radius: 22px; }
  .pb-search:focus { outline: none; border-color: var(--red); }
  .pb-datebox { display: flex; align-items: center; gap: 6px; font-size: 0.72rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); flex: 1 1 150px; }
  .pb-datebox input { flex: 1; min-width: 0; border: 1.5px solid var(--border); background: transparent; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.8rem; padding: 5px 10px; border-radius: 20px; }
  .pb-datebox input:focus { outline: none; border-color: var(--text); }
  .pb-chip { background: none; border: 1.5px solid var(--border); color: var(--text); border-radius: 20px; padding: 5px 13px;
    font-family: 'DM Sans', sans-serif; font-size: 0.78rem; cursor: pointer; }
  .pb-chip:hover { border-color: var(--red); color: var(--red); }
  .pb-chip.active { background: var(--red); border-color: var(--red); color: #fff; }
  .pb-toolbar { justify-content: space-between; }
  .pb-seg { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--muted); }
  .pb-seg .pb-chip { padding: 4px 11px; font-size: 0.75rem; }
  .pb-clear { background: none; border: none; color: var(--red); font-family: 'DM Sans', sans-serif; font-size: 0.78rem; font-weight: 600; cursor: pointer; padding: 4px 2px; }
  .pb-clear:hover { text-decoration: underline; }
  .pb-select {
    flex: 1 1 0; min-width: 0; max-width: 100%; border: 1.5px solid var(--border); background: transparent; color: var(--text);
    font-family: 'DM Sans', sans-serif; font-size: 0.8rem; padding: 6px 12px; border-radius: 20px; cursor: pointer;
  }
  .pb-select option { background: var(--card); color: var(--text); }
  .pb-select:focus { outline: none; border-color: var(--text); }
  .heart { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 4px; display: inline-flex; line-height: 0; }
  .heart:hover { color: var(--red); }
  .heart svg { fill: none; }
  .heart[aria-pressed="true"] { color: var(--red); }
  .heart[aria-pressed="true"] svg { fill: currentColor; }
  .pb-tile { position: relative; }
  .pb-tile-heart { position: absolute; top: 8px; right: 8px; width: 32px; height: 32px; padding: 0; align-items: center; justify-content: center;
    background: rgba(0,0,0,0.45); color: #fff; border-radius: 50%; }
  .pb-tile-heart:hover { background: rgba(0,0,0,0.65); color: #fff; }
  .pb-tile-heart[aria-pressed="true"] { color: #ff7a68; }
  #pb-map { overflow: hidden; height: min(62vh, 520px); min-height: 340px; border-radius: 8px; border: 1px solid var(--border); background: var(--tag-bg); margin-top: 16px; }
  [data-theme="dark"] #pb-map .leaflet-tile-pane { filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9); }
  .pb-pin span { display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 50%;
    background: var(--red); color: #fff; font: 700 0.78rem 'DM Sans', sans-serif; border: 2px solid #fff; box-shadow: 0 2px 6px rgba(0,0,0,0.4); }
  .pb-pin.sel span { outline: 3px solid var(--text); }
  #pb-map-note { font-size: 0.78rem; color: var(--muted); margin: 10px 0 0; }
  #pb-map-towns { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .pb-maprow { display: flex; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--border); cursor: pointer; align-items: center; }
  .pb-maprow:hover .pb-tile-title { color: var(--red); }
  .pb-maprow img { width: 56px; height: 72px; object-fit: cover; border-radius: 4px; background: var(--tag-bg); flex: none; }
  .pb-maprow .pb-tile-date { margin-top: 0; }
  .pb-count { font-size: 0.78rem; color: var(--muted); margin: 10px 0 4px; display: flex; justify-content: space-between; align-items: center; }
  /* Wall view: posters in columns, each at its own shape */
  .pb-wall { column-count: 2; column-gap: 14px; margin-top: 20px; }
  @media (min-width: 720px) { .pb-wall { column-count: 3; column-gap: 18px; } }
  .pb-tile { break-inside: avoid; margin-bottom: 20px; }
  .pb-tile .pb-poster { width: 100%; }
  .pb-tile-date { margin-top: 8px; font-size: 0.66rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--red); }
  .pb-tile-title { font-family: 'DM Serif Display', serif; font-size: 1.05rem; line-height: 1.15; margin-top: 2px; overflow-wrap: anywhere; }
  .pb-tile-venue { font-size: 0.74rem; color: var(--muted); margin-top: 2px; }
  .pb-tile.pb-broken .pb-poster { display: none; }

  .pb-day { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.25rem; color: var(--red);
    margin: 38px 0 18px; padding-bottom: 8px; border-bottom: 2px solid var(--red); }
  .pb-day:first-of-type { margin-top: 22px; }
  .pb-post { margin-bottom: 46px; }
  /* Each poster keeps its own shape; very tall ones are capped at ~78% of screen height */
  .pb-poster {
    display: block; position: relative; width: min(100%, calc(78vh * var(--ar, 0.75))); aspect-ratio: var(--ar, 3 / 4);
    margin: 0 auto; background: var(--tag-bg); border-radius: 6px; overflow: hidden; cursor: zoom-in;
    box-shadow: 0 4px 18px rgba(0,0,0,0.14); padding: 0; border: none;
  }
  [data-theme="dark"] .pb-poster { box-shadow: 0 4px 18px rgba(0,0,0,0.5); }
  .pb-poster img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .pb-post.pb-broken .pb-poster { display: none; }
  .pb-eyebrow { margin-top: 16px; font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--red); }
  .pb-title { font-family: 'DM Serif Display', serif; font-size: 1.65rem; line-height: 1.15; margin-top: 4px; overflow-wrap: anywhere; }
  .pb-where { font-family: 'Lora', serif; font-size: 1rem; margin-top: 6px; }
  .pb-where a { color: inherit; text-decoration: underline; text-decoration-color: var(--border); text-underline-offset: 3px; }
  .pb-where a:hover { text-decoration-color: var(--red); }
  .pb-drive { font-size: 0.8rem; color: var(--muted); margin-top: 4px; }
  .pb-actions { display: flex; align-items: center; gap: 14px; margin-top: 12px; }
  .pb-more { font-size: 0.82rem; font-weight: 600; color: var(--red); text-decoration: none; }
  .pb-more:hover { text-decoration: underline; }
  .icon-btn { background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 4px; display: inline-flex; }
  .icon-btn:hover { color: var(--red); background: var(--tag-bg); }
  .pb-loadmore { display: block; margin: 10px auto 0; background: none; border: 1.5px solid var(--border); color: var(--text);
    border-radius: 20px; padding: 9px 24px; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; cursor: pointer; }
  .pb-loadmore:hover { border-color: var(--red); color: var(--red); }
  .pb-empty { text-align: center; padding: 60px 20px; color: var(--muted); font-family: 'Lora', serif; }
  .pb-foot { text-align: center; font-size: 0.78rem; color: var(--muted); padding: 10px 16px 40px; }
  .pb-foot a { color: var(--muted); }

  .loading-spinner { width: 28px; height: 28px; margin: 0 auto; border: 3px solid var(--border); border-top-color: var(--red); border-radius: 50%; animation: kr-spin 0.8s linear infinite; }
  @keyframes kr-spin { to { transform: rotate(360deg); } }
  .kr-toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
    padding: 10px 18px; border-radius: 8px; font-size: 0.85rem; z-index: 9999; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .kr-toast.show { opacity: 1; }
  .kr-poster-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.93); z-index: 10001; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 40px 20px; }
  .kr-poster-overlay.show { display: flex; }
  .kr-poster-cap { color: #fff; text-align: center; font-size: 0.85rem; margin-top: 12px; max-width: 90vw; line-height: 1.35; }
  .kr-poster-cap b { font-family: 'DM Serif Display', serif; font-weight: 400; font-size: 1.1rem; display: block; }
  .kr-poster-img { max-width: 100%; max-height: calc(100% - 118px); min-height: 0; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); object-fit: contain; }
  .kr-poster-close { position: fixed; top: 18px; right: 22px; width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 1.2rem; line-height: 1; cursor: pointer;
    display: flex; align-items: center; justify-content: center; }
  .kr-poster-close:hover { background: rgba(255,255,255,0.25); }
  .v-nav { position: fixed; top: 50%; transform: translateY(-50%); width: 44px; height: 64px; border: none; border-radius: 8px;
    background: rgba(255,255,255,0.12); color: #fff; font-size: 2rem; line-height: 1; cursor: pointer; }
  .v-nav:hover { background: rgba(255,255,255,0.25); }
  .v-prev { left: 8px; } .v-next { right: 8px; }
  .v-bar { display: flex; align-items: center; gap: 6px; margin-top: 10px; }
  .v-btn { background: rgba(255,255,255,0.12); border: none; color: #fff; border-radius: 20px; min-width: 40px; height: 36px; padding: 0 12px;
    font-family: 'DM Sans', sans-serif; font-size: 0.8rem; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .v-btn:hover { background: rgba(255,255,255,0.25); }
  .v-bar .heart { color: #fff; padding: 0 12px; }
  .v-bar .heart[aria-pressed="true"] { color: #ff7a68; }
  .v-count { color: rgba(255,255,255,0.7); font-size: 0.78rem; margin-left: 6px; }
  .v-progress { position: fixed; top: 0; left: 0; right: 0; height: 3px; background: transparent; }
  .v-progress span { display: block; height: 100%; width: 0; background: var(--red); }
  @media (max-width: 480px) { .v-nav { width: 36px; height: 52px; font-size: 1.6rem; } }
  @media (max-width: 480px) { header { padding: 0 14px; } }
</style>
<script>
  // Apply saved/system theme before paint (same preference the main site uses)
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('kr_theme'); } catch (e) {}
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>
</head>
<body>

<header>
  <a href="/" class="logo">Kingston<span>Radius</span></a>
  <button id="theme-toggle-btn" aria-label="Toggle dark mode" title="Toggle dark mode">
    <svg id="theme-icon-sun" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none;"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg id="theme-icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
  </button>
</header>

<div class="pb-wrap" id="pb-wrap">
  <div class="pb-head">
    <h1>Upcoming Shows</h1>
  </div>
  <div class="pb-filters">
    <input type="search" id="pb-search" class="pb-search" placeholder="Search shows, venues, towns…" autocomplete="off" aria-label="Search">
    <div class="pb-row">
      <select id="pb-distance" class="pb-select" aria-label="Distance" style="display:none;"></select>
      <select id="pb-venue" class="pb-select" aria-label="Venue"></select>
    </div>
    <div class="pb-row">
      <label class="pb-datebox">From <input type="date" id="pb-from"></label>
      <label class="pb-datebox">To <input type="date" id="pb-to"></label>
    </div>
    <div class="pb-row" id="pb-chips">
      <button class="pb-chip" data-quick="today">Today</button>
      <button class="pb-chip" data-quick="weekend">This weekend</button>
      <button class="pb-chip" data-quick="week">Next 7 days</button>
      <button class="pb-chip" data-quick="month">Next 30 days</button>
      <button class="pb-chip" id="pb-saved" aria-pressed="false">♥ Saved <span id="pb-saved-n"></span></button>
    </div>
    <div class="pb-row pb-toolbar">
      <span class="pb-seg">Sort <button class="pb-chip" data-sort="date">Date</button><button class="pb-chip" data-sort="venue">Venue</button></span>
      <span class="pb-seg">View <button class="pb-chip" data-view-mode="feed">Feed</button><button class="pb-chip" data-view-mode="wall">Wall</button><button class="pb-chip" data-view-mode="map">Map</button></span>
    </div>
  </div>
  <div class="pb-count"><span id="pb-count"></span><span><button class="pb-clear" id="pb-slideshow" type="button">▶ Slideshow</button> <button class="pb-clear" id="pb-surprise" type="button">Surprise me</button> <button class="pb-clear" id="pb-clear" type="button" style="display:none;">Clear filters</button></span></div>
  <div id="pb-map-wrap" style="display:none;">
    <div id="pb-map"></div>
    <div id="pb-map-note"></div>
    <div id="pb-map-towns"></div>
    <div id="pb-map-panel"></div>
  </div>
  <div id="pb-feed"><div style="text-align:center;padding:60px 20px;"><div class="loading-spinner"></div></div></div>
</div>
<div class="pb-foot"><a href="/">← All Kingston Radius listings</a></div>

<div id="kr-poster-overlay" class="kr-poster-overlay" role="dialog" aria-modal="true" aria-label="Poster viewer">
  <div class="v-progress"><span id="v-progress"></span></div>
  <button id="kr-poster-close" class="kr-poster-close" aria-label="Close" title="Close">✕</button>
  <button id="v-prev" class="v-nav v-prev" aria-label="Previous poster">‹</button>
  <img id="kr-poster-img" class="kr-poster-img" src="" alt="Show poster">
  <button id="v-next" class="v-nav v-next" aria-label="Next poster">›</button>
  <div id="kr-poster-cap" class="kr-poster-cap"></div>
  <div class="v-bar">
    <button id="v-fav" class="v-btn heart" aria-label="Save this show" aria-pressed="false"></button>
    <button id="v-play" class="v-btn" aria-label="Play slideshow">▶</button>
    <button id="v-speed" class="v-btn" aria-label="Slideshow speed">6s</button>
    <button id="v-full" class="v-btn" aria-label="Full screen" style="display:none;">⛶</button>
    <span id="v-count" class="v-count"></span>
  </div>
</div>

<script>
// ── Helpers (same rules the main listings page uses) ──────────────────────────
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function parseDate(s) { if (!s) return new Date(0); const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); }
function eventKey(e) { return `${e.venue}||${e.date}||${e.time||''}`; }
function formatTime(t) {
  if (!t || t === 'See website') return '';
  t = t.trim();
  if (/^\d{1,2}:\d{2}\s*[ap]m$/i.test(t)) return t.replace(/\s*([ap]m)$/i, (_, s) => ' ' + s.toLowerCase());
  if (/^\d{1,2}:\d{2}$/.test(t)) { const [h,m] = t.split(':').map(Number); return `${h % 12 || 12}:${String(m).padStart(2,'0')} ${h >= 12 ? 'pm' : 'am'}`; }
  return t;
}
function shortHash(str) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0; return (h >>> 0).toString(36); }
function isRejected(s) { return s === 'rejected' || s === 'purged' || (typeof s === 'object' && s && (s.status === 'rejected' || s.status === 'purged')); }
function isApproved(s) { return s === 'approved' || (typeof s === 'object' && s && s.status === 'approved'); }
function lsGet(key, fallback) { try { return JSON.parse(localStorage.getItem(key) || 'null') ?? fallback; } catch { return fallback; } }

// ── Data ──────────────────────────────────────────────────────────────────────
let POSTS = [];          // upcoming, approved shows that have a poster
let LOADED = false;
const PB_STEP = 12, WALL_STEP = 24;
const step = () => S.view === 'wall' ? WALL_STEP : PB_STEP;

// ── Favorites (kept on this device only) ──────────────────────────────────────
let FAVS = new Set();
try { FAVS = new Set(JSON.parse(localStorage.getItem('kr_blog_favs') || '[]')); } catch {}
function saveFavs() { try { localStorage.setItem('kr_blog_favs', JSON.stringify([...FAVS])); } catch {} }
const HEART = '<svg viewBox="0 0 24 24" width="17" height="17" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1.1a5.5 5.5 0 0 0-7.8 7.8l1 1.1L12 21.2l7.8-7.7 1-1.1a5.5 5.5 0 0 0 0-7.8z"/></svg>';
const heartBtn = (key, cls) => `<button class="heart ${cls||''}" data-fav="${esc(key)}" aria-pressed="${FAVS.has(key)}" title="Save this show" aria-label="Save this show">${HEART}</button>`;
function toggleFav(key) {
  if (FAVS.has(key)) FAVS.delete(key); else FAVS.add(key);
  saveFavs();
  document.querySelectorAll('[data-fav]').forEach(b => { if (b.dataset.fav === key) b.setAttribute('aria-pressed', FAVS.has(key)); });
  updateSavedChip();
  if (S.saved) render();
}
function updateSavedChip() {
  const n = POSTS.filter(e => FAVS.has(eventKey(e))).length;
  document.getElementById('pb-saved-n').textContent = n ? `(${n})` : '';
}
const S = { q: '', from: '', to: '', venue: '', dist: 'all', saved: false, sort: 'date', view: 'feed' };
let _pbShown = PB_STEP;
let DRIVE = null;        // venue -> minutes from Kingston (read from index.html so both pages always agree)
let CUSTOM_DRIVE = {};   // drive times saved on custom venue templates
let TOWNS = null;        // town -> {lat,lng}, also read from index.html

// The drive-time table lives in index.html. Read it from there rather than keeping a second
// copy, so editing a drive time on the main site updates this page too. If it can't be read,
// the distance filter simply stays hidden.
async function loadDriveTimes() {
  const out = { drive: null, towns: null };
  try {
    const resp = await fetch('/index.html');
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    const text = await resp.text();
    const grab = name => {
      try {
        const m = text.match(new RegExp('const ' + name + ' = (\\{[\\s\\S]*?\\n\\});'));
        const obj = m ? new Function('return ' + m[1])() : null;
        return (obj && typeof obj === 'object') ? obj : null;
      } catch (e) { return null; }
    };
    out.drive = grab('DRIVE_TIMES');
    out.towns = grab('TOWN_COORDS');   // town -> lat/lng, used only by the Map view
  } catch (e) { console.warn('Drive times / towns unavailable:', e); }
  return out;
}
function knownDrive(venue) {
  if (DRIVE && DRIVE[venue] !== undefined) return DRIVE[venue];
  const c = CUSTOM_DRIVE[venue];
  return (c && c.drive) ? c.drive : undefined;
}
function passesDistance(e, f) {

    const m = L.marker(pt, { icon, title: `${g.name} — ${n} show${n === 1 ? '' : 's'}`, riseOnHover: true });
    m.on('click', () => showTown(g.key));
    m.addTo(MAP_LAYER); MAP_MARKERS.set(g.key, m);
  }
  setTimeout(() => {
    MAP.invalidateSize();
    if (pts.length === 1) MAP.setView(pts[0], 11);
    else MAP.fitBounds(L.latLngBounds(pts), { padding: [34, 34], maxZoom: 11 });
    markSelected();
  }, 60);
  if (SEL_TOWN && MAP_GROUPS.has(SEL_TOWN)) showTown(SEL_TOWN); else { SEL_TOWN = null; vEl('pb-map-panel').innerHTML = ''; }
}
function markSelected() {
  for (const [k, m] of MAP_MARKERS) { const el = m._icon; if (el) el.classList.toggle('sel', k === SEL_TOWN); }
}
function showTown(key) {
  const g = MAP_GROUPS.get(key); if (!g) return;
  SEL_TOWN = key; markSelected();
  vEl('pb-map-panel').innerHTML =
    `<h2 class="pb-day" style="margin-top:22px;">${esc(g.name)} — ${g.list.length} show${g.list.length === 1 ? '' : 's'}</h2>` +
    g.list.map((e, i) => `<div class="pb-maprow" data-maprow="${i}">
      <img src="${esc(e.posterUrl)}" alt="" loading="lazy">
      <div><div class="pb-tile-date">${esc(shortDate(e))}${formatTime(e.time) ? ' · ' + esc(formatTime(e.time)) : ''}</div>
      <div class="pb-tile-title">${esc(e.title)}</div><div class="pb-tile-venue">${esc(e.venue)}</div></div></div>`).join('');
}
vEl('pb-map-panel').addEventListener('click', ev => {
  const row = ev.target.closest('[data-maprow]'); if (!row || !SEL_TOWN) return;
  const g = MAP_GROUPS.get(SEL_TOWN); if (g) openViewer(g.list, +row.dataset.maprow, false);
});
vEl('pb-map-towns').addEventListener('click', ev => {
  const b = ev.target.closest('[data-town]'); if (b) { showTown(b.dataset.town); vEl('pb-map-panel').scrollIntoView({ behavior: 'smooth', block: 'start' }); }
});

const reset = () => { _pbShown = step(); };
let _qTimer;
document.getElementById('pb-search').addEventListener('input', ev => { clearTimeout(_qTimer); _qTimer = setTimeout(() => { S.q = ev.target.value; reset(); render(); }, 150); });
document.getElementById('pb-distance').addEventListener('change', ev => { S.dist = ev.target.value; reset(); render(); });
document.getElementById('pb-venue').addEventListener('change', ev => { S.venue = ev.target.value; reset(); render(); });
document.getElementById('pb-from').addEventListener('change', ev => {
  S.from = ev.target.value;
  if (S.from && S.to && S.to < S.from) { S.to = S.from; document.getElementById('pb-to').value = S.to; }
  reset(); render();
});
document.getElementById('pb-to').addEventListener('change', ev => {
  S.to = ev.target.value;
  if (S.from && S.to && S.to < S.from) { S.from = S.to; document.getElementById('pb-from').value = S.from; }
  reset(); render();
});
document.getElementById('pb-chips').addEventListener('click', ev => {
  const b = ev.target.closest('[data-quick]'); if (!b) return;
  const [f, t] = quickRange(b.dataset.quick);
  const already = S.from === f && S.to === t;          // tapping an active chip turns it off
  S.from = already ? '' : f; S.to = already ? '' : t;
  document.getElementById('pb-from').value = S.from; document.getElementById('pb-to').value = S.to;
  reset(); render();
});
document.querySelectorAll('[data-sort]').forEach(b => b.addEventListener('click', () => { S.sort = b.dataset.sort; reset(); render(); }));
document.querySelectorAll('[data-view-mode]').forEach(b => b.addEventListener('click', () => { S.view = b.dataset.viewMode; reset(); render(); }));
document.getElementById('pb-clear').addEventListener('click', () => {
  Object.assign(S, { q: '', from: '', to: '', venue: '', dist: 'all', saved: false });
  setupControls(); reset(); render();
});
document.getElementById('pb-surprise').addEventListener('click', () => {
  const ev = filtered(); if (!ev.length) return;
  openViewer(ev, Math.floor(Math.random() * ev.length), false);
});
document.getElementById('pb-slideshow').addEventListener('click', () => openViewer(filtered(), 0, true));
document.getElementById('pb-saved').addEventListener('click', () => { S.saved = !S.saved; reset(); render(); });
document.getElementById('pb-feed').addEventListener('click', async ev => {
  if (ev.target.closest('#pb-loadmore')) { _pbShown += step(); render(); return; }
  const f = ev.target.closest('[data-fav]'); if (f) { toggleFav(f.dataset.fav); return; }
  const v = ev.target.closest('[data-view]');  if (v) { showPoster(v.dataset.view, v.dataset.key); return; }
  const s = ev.target.closest('[data-share]'); if (s) { const e = POSTS.find(x => eventKey(x) === s.dataset.share); if (e) await shareEvent(e); return; }
  const c = ev.target.closest('[data-copy]');  if (c) {
    const e = POSTS.find(x => eventKey(x) === c.dataset.copy);
    if (e) { try { await navigator.clipboard.writeText(blurb(e)); showToast('Copied!'); } catch { showToast('Could not copy'); } }
  }
});

// Dark-mode toggle (shares the main site's saved preference)
function syncThemeIcons() {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.getElementById('theme-icon-sun').style.display  = dark ? 'block' : 'none';
  document.getElementById('theme-icon-moon').style.display = dark ? 'none' : 'block';
}
document.getElementById('theme-toggle-btn').addEventListener('click', () => {
  const dark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (dark) document.documentElement.removeAttribute('data-theme'); else document.documentElement.setAttribute('data-theme', 'dark');
  try { localStorage.setItem('kr_theme', dark ? 'light' : 'dark'); } catch {}
  syncThemeIcons();
});
syncThemeIcons();

load();
</script>
</body>
</html>
